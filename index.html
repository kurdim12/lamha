<style>
:root{
  /* Layout: brand lockup on top, one calm task per screen for the patient (elderly-first, huge targets); split panes for doctor and partner center.
     Brand: Lamha red #B42D25 · care coral #D3543C · balance taupe #B9A690 · clarity off-white #F8F6F3. Triage colours stay semantic and fixed. */
  --bg:#F8F6F3;--surface:#FFFFFF;--surface-2:#F2EDE7;--ink:#2A1F1D;--muted:#6E615A;--line:#E7DED5;
  --brand:#B42D25;--brand-2:#D3543C;--taupe:#B9A690;--taupe-ink:#7E6B58;--taupe-soft:#EEE6DC;--mark-filter:none;--hero-tile:transparent;--hero-pad:0px;
  --accent:#B42D25;--accent-ink:#FFFFFF;--accent-soft:#F7E4DF;
  --em:#C8161D;--em-soft:#FCE5E3;--em-strong:#A8151B;
  --ur:#A65300;--ur-soft:#FCEBD8;--ro:#7A5A00;--ro-soft:#F7EDCB;--sc:#19693D;--sc-soft:#DDF0E4;--re:#655950;--re-soft:#ECE6E0;
  --shadow:0 1px 2px rgb(42 31 29 / .05),0 12px 32px rgb(42 31 29 / .07);
  --font:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans Arabic",ui-monospace,Consolas,monospace;
  --r:22px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161110;--surface:#201917;--surface-2:#2A211F;--ink:#F4EEE8;--muted:#B5A79C;--line:#3A2E2A;
  --brand:#E0574A;--brand-2:#E8735C;--taupe:#CDBBA5;--taupe-ink:#CDBBA5;--taupe-soft:#2F2623;--mark-filter:brightness(1.55) saturate(1.1);--hero-tile:#FFFFFF;--hero-pad:12px;

  --shadow:0 1px 2px rgb(0 0 0 / .35),0 12px 32px rgb(0 0 0 / .3);color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.65;min-height:100vh}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
h1{font-family:var(--display);font-size:clamp(30px,5vw,46px);font-weight:600}
h2{font-family:var(--display);font-size:26px;font-weight:600}
h3{font-family:var(--display);font-size:20px;font-weight:500}
p{margin:0}
a{color:var(--accent)}
.lv-emergency{--lv:var(--em);--lv-soft:var(--em-soft)}
.lv-urgent{--lv:var(--ur);--lv-soft:var(--ur-soft)}
.lv-routine{--lv:var(--ro);--lv-soft:var(--ro-soft)}
.lv-self_care{--lv:var(--sc);--lv-soft:var(--sc-soft)}
.lv-remeasure{--lv:var(--re);--lv-soft:var(--re-soft)}

splay:inline-block;flex:none;aspect-ratio:510/150;background:var(--brand);-webkit-mask:var(--wimg) center/contain no-repeat;mask:var(--wimg) center/contain no-repeat}
.app-tile{display:inline-grid;place-items:center;flex:none;background:#fff;border-radius:28%;box-shadow:0 1px 2px rgb(42 31 29 / .08),0 6px 16px rgb(180 45 37 / .16)}
.latin-tag{display:inline-flex;align-items:center;gap:8px;direction:ltr;font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.5em;text-indent:.5em;color:var(--taupe-ink);white-space:nowrap}
.latin-tag::before,.latin-tag::after{content:"";width:18px;height:1px;background:currentColor;opacity:.55}
nav.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px}
nav.tabs a{min-height:48px;padding:6px 16px;white-space:nowrap;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600;display:flex;align-items:center}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.tools{margin-inline-start:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.net,.ai{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:14px;font-weight:600;font-family:var(--font)}
.net::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.net.on,.net.off{color:var(--ink);background:var(--surface-2)}
.net.on::before{background:var(--sc)}
.net.off::before{background:var(--ur)}
.ai{color:var(--muted);background:var(--surface-2)}
.tbtn{min-height:48px;min-width:48px;justify-content:center;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tbtn:hover{border-color:var(--accent)}
.tbtn .lbl-short{display:none}
.tbtn .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tbtn[aria-pressed="true"] .dot{background:var(--sc);border-color:var(--bg)}

main{max-width:1220px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot{max-width:1220px;margin:0 auto;color:var(--muted);font-size:15px;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,28px);box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px}
.muted{color:var(--muted)}
.small{font-size:16px}
.lead{font-size:21px;color:var(--muted)}
.eyebrow{font-size:15px;font-weight:600;color:var(--brand);letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums;font-family:var(--font)}
.ltr{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.btn{min-height:56px;padding:10px 24px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:transform .12s ease,background .2s ease,border-color .2s ease}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 86%,#000)}
.btn.big{min-height:68px;font-size:22px;padding-inline:34px}
.btn.wide{width:100%}
.btn.danger{background:var(--em-strong);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:is(.btn,.tbtn,a,button,input,textarea,select,summary):focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;font-size:15px;font-weight:600;background:var(--lv-soft,var(--surface-2));color:var(--lv,var(--muted));white-space:nowrap}
.pill.solid{background:var(--lv);color:var(--surface)}
.tag{display:inline-block;font-family:var(--mono);font-size:12px;padding:1px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);direction:ltr}
.badge-demo{background:var(--ro-soft);color:var(--ro)}
textarea,input[type="text"],input[type="password"],input[type="number"],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-height:56px}
textarea{resize:vertical;line-height:1.7}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600}
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.dots{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.fade-in{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* steps */
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 22px;counter-reset:s}
.steps li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--muted);font-weight:600;min-width:0}
.steps li::before{content:"";height:6px;border-radius:99px;background:var(--line);transition:background .3s}
.steps li.done::before{background:var(--taupe)}
.steps li.now::before{background:var(--brand)}
.steps li.now{color:var(--ink)}
.steps li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* welcome */
.welcome{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
.hero{display:flex;flex-direction:column;gap:22px;background:linear-gradient(165deg,var(--surface) 52%,var(--accent-soft))}
.lockup{display:grid;grid-template-columns:auto auto;column-gap:18px;row-gap:6px;align-items:center;justify-content:start}
.lockup .logo-mark{grid-row:1 / span 2;width:clamp(84px,12vw,112px);filter:none;background-color:var(--hero-tile);background-origin:content-box;padding:var(--hero-pad);border-radius:24%;box-sizing:border-box}
.lockup .logo-word{height:clamp(42px,6vw,56px);align-self:end}
.lockup .latin-tag{align-self:start}
.tagline{font-family:var(--display);font-size:clamp(34px,5.5vw,52px);font-weight:600;line-height:1.15}
.tagline em{font-style:normal;color:var(--brand)}
.journey{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;counter-reset:j}
.journey li{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);counter-increment:j}
.journey li::after{content:counter(j);position:absolute;top:12px;inset-inline-end:14px;font-family:var(--display);font-size:15px;color:var(--taupe-ink)}
.journey .ji{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--brand)}
.journey b{font-family:var(--display);font-weight:600;font-size:19px}
.journey small{color:var(--muted);font-size:15px;line-height:1.45}
.foot-in{display:flex;align-items:center;gap:14px}
.foot-tile{width:34px;height:34px}
.foot-tile .logo-mark{width:24px}

/* consent */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.facts > div{background:var(--surface-2);border-radius:16px;padding:16px}
.tog{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;cursor:pointer;background:var(--surface)}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .sw{flex:none;width:58px;height:34px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--muted);position:relative;transition:background .2s,box-shadow .2s}
.tog .sw::after{content:"";position:absolute;top:7px;inset-inline-start:7px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:all .2s}
.tog input:checked + .sw{background:var(--accent);box-shadow:none}
.tog input:checked + .sw::after{top:4px;inset-inline-start:28px;width:26px;height:26px;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.tog:has(input:checked){border-color:var(--accent)}
.tog input:focus-visible + .sw{outline:3px solid var(--accent);outline-offset:3px}
.tog .tx{display:flex;flex-direction:column;line-height:1.4}
.tog .tx small{color:var(--muted);font-size:15px}

/* camera stage */
.meas-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.stage{position:relative;border-radius:24px;overflow:hidden;background:#0d1615;aspect-ratio:4/3;width:100%;max-width:100%;box-shadow:var(--shadow)}
.stage video,.stage canvas.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.stage .msg{position:absolute;inset-inline:16px;bottom:16px;padding:10px 16px;border-radius:14px;background:rgb(0 0 0 / .6);color:#fff;font-size:20px;font-weight:600;text-align:center}
.stage .veil{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:rgb(10 20 19 / .72);color:#fff;font-size:26px;font-weight:700;text-align:center;padding:24px}
.stage .veil small{font-size:17px;font-weight:400;opacity:.85}
.checks li{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;background:var(--surface-2);font-weight:600}
.checks li.ok{background:var(--sc-soft);color:var(--sc)}
.checks li.bad{background:var(--ur-soft);color:var(--ur)}
.ring-wrap{position:relative;width:150px;height:150px;margin-inline:auto}
.ring-wrap svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring-wrap circle{fill:none;stroke-width:10}
.ring-bg{stroke:var(--taupe-soft)}
.ring-fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-txt b{font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.ring-txt span{font-size:15px;color:var(--muted)}
.live{display:flex;align-items:center;gap:16px}
.heart{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);animation:beat var(--beat,1s) ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(.8);opacity:.65}14%{transform:scale(1.18);opacity:1}28%{transform:scale(.92)}42%{transform:scale(1.04)}}
.vital-num{font-size:clamp(48px,7vw,64px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.qbar{position:relative;height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.qbar > i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:var(--ur);border-radius:99px;transition:width .4s ease,background .3s}
.qbar > i.good{background:var(--sc)}
.qbar > b{position:absolute;inset-block:-2px;width:3px;background:var(--ink);opacity:.5}
canvas.wave{width:100%;height:84px;display:block;border-radius:12px;background:var(--surface-2)}

/* speech */
.mic-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.mic{width:112px;height:112px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s}
.mic[aria-pressed="true"]{background:var(--ink);color:var(--bg);animation:micPulse 1.4s ease-in-out infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 50%,transparent)}50%{box-shadow:0 0 0 18px transparent}}
canvas.meter{flex:1;min-width:160px;height:72px;border-radius:14px;background:var(--surface-2)}
.mic-clock{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:3ch}

/* confirm */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:56px;padding:8px 18px;border-radius:99px;border:2px solid var(--taupe-ink);background:var(--taupe-soft);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.chip .mk{font-weight:700;color:var(--sc)}
.chip[aria-pressed="false"]{border-color:var(--line);background:var(--surface);color:var(--muted);text-decoration:line-through}
.chip[aria-pressed="false"] .mk{color:var(--muted)}
.chip.flag{border-color:var(--em);background:var(--em-soft);color:var(--em)}
.chip.flag::before{content:"!";display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--em-strong);color:#fff;font-weight:700;font-size:15px}
.chip.flag .mk{color:var(--em)}
.qa{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;padding:12px 16px;border-radius:16px;background:var(--surface-2)}
.seg{display:flex;gap:6px}
.seg button{min-height:52px;min-width:76px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* report */
.report{display:flex;flex-direction:column;gap:20px;max-width:900px;margin-inline:auto}
.rep-head{border-radius:var(--r);padding:clamp(20px,3vw,30px);background:var(--lv-soft);color:var(--ink);display:flex;flex-direction:column;gap:10px}
.rep-head .lvl{display:flex;align-items:center;gap:12px;color:var(--lv);font-weight:700;font-size:24px}
.rep-head .lvl::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--lv)}
.rep-head .next{font-size:24px;font-weight:700}
.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.vital{background:var(--surface-2);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.vital .k{font-size:16px;color:var(--muted);font-weight:600}
.vital .v{font-size:48px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.vital .v small{font-size:17px;font-weight:500;color:var(--muted)}
.vital .d{font-weight:600}
.advice li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.advice .tag{flex:none;align-self:center;background:var(--taupe-soft);color:var(--taupe-ink);font-size:11px}
.warn911 li{padding:10px 14px;border-radius:14px;background:var(--em-soft);color:var(--ink);font-weight:600}
.em-banner{background:var(--em-strong);color:#fff;border-radius:var(--r);padding:clamp(20px,4vw,34px);display:flex;flex-direction:column;gap:16px;animation:emIn .4s ease both}
@keyframes emIn{from{transform:scale(.98);opacity:0}to{transform:none;opacity:1}}
.em-banner h2{font-size:clamp(28px,5vw,40px);color:#fff}
.btn-911{display:flex;align-items:center;justify-content:center;gap:14px;min-height:96px;border-radius:20px;background:#fff;color:#9E1C14;font-size:clamp(30px,6vw,44px);font-weight:700;text-decoration:none;box-shadow:0 10px 30px rgb(0 0 0 / .25)}
.btn-911:focus-visible{outline:4px solid #fff;outline-offset:4px}
.alert-box{border-radius:18px;padding:18px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.alert-box.wait{border-color:var(--ur);background:var(--ur-soft)}
.alert-box.ok{border-color:var(--sc);background:var(--sc-soft)}
.alert-box .big{font-size:22px;font-weight:700}
.ladder{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ladder li{display:flex;justify-content:space-between;gap:10px;font-size:16px;padding:8px 12px;border-radius:10px;background:var(--surface)}
.ladder li.cur{outline:2px solid var(--ur)}
.ladder li.ack{outline:2px solid var(--sc)}
.qr-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr-box .qr{background:#fff;padding:10px;border-radius:12px;line-height:0}
.qr-box .qr img,.qr-box .qr canvas{width:156px;height:156px}
.disclaimer{font-weight:700;text-align:center;padding:14px;border-radius:14px;background:var(--surface-2)}

/* doctor */
.doc-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;align-items:start}
.doc-grid > aside{position:sticky;top:96px;max-height:calc(100vh - 110px)}
.queue{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1;overflow:auto;padding:2px}
.qitem{display:flex;flex-direction:column;gap:6px;text-align:start;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-height:56px}
.qitem[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.qitem .t{font-size:15px;color:var(--muted)}
.qitem .why{font-size:16px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem.fresh{animation:flash 1.6s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--surface)}}
.note{font-family:var(--mono);font-size:14.5px;line-height:1.6;white-space:pre-wrap;direction:ltr;text-align:left;background:var(--surface-2);border-radius:14px;padding:16px;margin:0;overflow-x:auto}
.fc-table{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fc-table > div{padding:10px 14px;border-bottom:1px solid var(--line)}
.fc-table > div:nth-child(odd){background:var(--surface-2);font-weight:600;color:var(--muted);font-size:16px}
.fc-table > div:nth-last-child(-n+2){border-bottom:0}
.chart-box{position:relative;height:360px;width:100%}
details > summary{cursor:pointer;font-weight:600;min-height:48px;display:flex;align-items:center;gap:12px;list-style:none;color:var(--brand)}
details > summary::-webkit-details-marker{display:none}
details > summary::before{content:"";flex:none;width:9px;height:9px;border:solid currentColor;border-width:0 0 2px 2px;transform:rotate(45deg);transition:transform .2s}
details[open] > summary::before{transform:rotate(-45deg)}
.quote{border-inline-start:4px solid var(--taupe);padding:6px 14px;background:var(--surface-2);border-radius:12px;border-start-start-radius:0;border-end-start-radius:0}

/* facility */
.fac-alert{border:3px solid var(--em);background:var(--em-soft);border-radius:var(--r);padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:12px;animation:facPulse 1.2s ease-in-out infinite}
@keyframes facPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--em) 40%,transparent)}50%{box-shadow:0 0 0 14px transparent}}
.fac-alert.acked{animation:none;border-color:var(--sc);background:var(--surface)}
.fac-alert h2{color:var(--em)}
.fac-alert.acked h2{color:var(--sc)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv > div{background:var(--surface);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.kv b{font-size:15px;color:var(--muted);font-weight:600}
.kv span{font-size:22px;font-weight:700}
table.audit{width:100%;border-collapse:collapse;font-size:16px}
table.audit th,table.audit td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.audit th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}

dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgb(5 15 14 / .5)}
dialog form{padding:24px;display:flex;flex-direction:column;gap:16px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:max(16px,env(safe-area-inset-left,0px));margin-inline:auto;max-width:560px;background:var(--ink);color:var(--bg);padding:14px 18px;border-radius:14px;font-weight:600;z-index:50;text-align:center;box-shadow:var(--shadow)}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--surface-2);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:900px){
  .grid2,.meas-grid,.doc-grid,.welcome{grid-template-columns:minmax(0,1fr)}
  nav.tabs{order:3;width:100%}
  nav.tabs a{flex:1;justify-content:center}
  .doc-grid > aside{position:static;max-height:none}
}
@media (max-width:560px){
  body{font-size:18px}
  header.top{position:static}
  .facts{grid-template-columns:1fr}
  .steps li span{display:none}
  .brand-txt .latin-tag{display:none}
  #facWinBtn,#aiBadge{display:none}
  .tbtn .lbl{display:none}
  .tbtn .lbl-short{display:inline}
  nav.tabs a{padding-inline:8px;font-size:16px}
  .journey{gap:8px}
  .journey li{padding:10px;align-items:center;text-align:center}
  .journey small,.journey li::after{display:none}
  .journey .ji{width:44px;height:44px}
  .lockup .logo-mark{width:68px}
  .hero{gap:16px}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fc-table{grid-template-columns:1fr}
  .fc-table > div:nth-child(odd){border-bottom:0;padding-bottom:2px}
  table.audit{min-width:560px}
  .btn.big{width:100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  header.top,.steps,.no-print,.foot,#toast{display:none!important}
  body{background:#fff;color:#000;font-size:15px}
  main{padding:0}
  .card,.vital,.rep-head{box-shadow:none;border:1px solid #bbb}
  .report{gap:12px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#patient" aria-label="لمحة · Lamha، الصفحة الرئيسية">
      <span class="app-tile brand-tile"><span class="logo-mark"></span></span>
      <span class="brand-txt"><span class="logo-word"></span><span class="latin-tag">LAMHA</span></span>
    </a>
    <nav class="tabs" aria-label="الشاشات">
      <a id="nav-patient" href="#patient">المريض</a>
      <a id="nav-doctor" href="#doctor">الطبيب</a>
      <a id="nav-facility" href="#facility">المركز الشريك</a>
    </nav>
    <div class="tools">

    e.preventDefault();
    S.settings.groqKey = $('#groqKey').value.trim();
    const q = parseFloat($('#sqiMin').value); S.settings.sqiMin = isFinite(q) ? Math.min(0.95, Math.max(0.1, q)) : 0.5;
    S.settings.theme = $('#themeSel').value;
    saveSettings(); applyTheme(); renderStatus(); $('#settings').close(); refreshViews();
    toast('انحفظت الإعدادات');
  });
  $('#resetDemo').onclick = () => {
    ['lamha:checkins', 'lamha:alerts', 'lamha:audit'].forEach(k => LS.del(k));
    try { Object.keys(localStorage).filter(k => k.startsWith('lamha:lastAlert:')).forEach(k => LS.del(k)); } catch {}
    resetAlertState(); bus('reset', {}); $('#settings').close(); refreshViews(); toast('انمسحت الفحوصات والتنبيهات (أبو محمد بيضل)');
  };
  // a second tab can hear the bus before localStorage has propagated: merge the payload, and also refresh on storage changes
  addEventListener('storage', e => {
    if (!['lamha:alerts', 'lamha:checkins', 'lamha:audit'].includes(e.key)) return;
    if (e.key === 'lamha:alerts' && P.alert && !P.alert.acked) { const cur = latestAlert(P.alert.id); if (cur?.acked) onAck({ alert_id: cur.id, by: cur.acked.by, at: cur.acked.at }); }
    clearTimeout(refreshViews._t); refreshViews._t = setTimeout(refreshViews, 120);
  });
  onBus(msg => {
    if (msg.type === 'alert' && msg.data?.id) mergeAlert(msg.data);
    if (msg.type === 'reset') resetAlertState();
    if (msg.type === 'ack') { const cur = latestAlert(msg.data.alert_id); if (cur && !cur.acked) { cur.acked = { by: msg.data.by, at: msg.data.at }; Store.putAlert(cur); } onAck(msg.data); }
    if (msg.type === 'checkin') D.fresh = msg.data.id;
    if (msg.type === 'alert' && !$('#view-facility').hidden) toast('تنبيه حرج جديد');
    if (['checkin', 'alert', 'ack', 'reset'].includes(msg.type)) refreshViews();
  });
  try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch {}
  route();
}
init();
</script>
</body>
</html>
